name: Cargo Build & Test
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4

      # Rewrite SSH git URLs to HTTPS so Cargo can clone private/custom deps
      # without needing SSH keys. This affects transitive dependencies that
      # reference git repos via ssh://git@github.com/... (e.g. fs-err).
      - name: Configure git to use HTTPS instead of SSH for GitHub
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ffmpeg libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libva-dev clang pkg-config

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
