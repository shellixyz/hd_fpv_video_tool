[package]
name = "hd_fpv_video_tool"
description = "A software tool to manipulate video files and OSD files recoded with the DJI and Walksnail Avatar FPV systems"
version = "2.2.0"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Michel Pastor <shellixyz@gmail.com>"]
rust-version = "1.88"
repository = "https://github.com/shellixyz/hd_fpv_video_tool"
homepage = "https://github.com/shellixyz/hd_fpv_video_tool"
keywords = ["dji", "fpv", "video", "osd"]
categories = ["command-line-utilities", "encoding", "multimedia"]
readme = "README.md"
exclude = ["*.webm", "*.osd", "*.mp4", "*.bin"]
publish = false

[workspace]
members = ["appimage_builder", "appimage_builder/runner"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "string"] }
image = { version = "0.25.10", features = ["png"], default-features = false }
log = "0.4.34"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "deref", "deref_mut", "from", "constructor", "error", "is_variant"] }
byte_struct = "0.9.0"
hd_fpv_osd_font_tool = { version = "~1", git = "https://github.com/shellixyz/hd_fpv_osd_font_tool" }
getset = "0.1.7"
rayon = "1.12.0"
indicatif = { version = "0.18.6", features = ["rayon"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
regex = "1.13.1"
ffmpeg-next = "9.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
itertools = "0.15.0"
path-absolutize = "4.0.1"
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
env_logger = "0.11.11"
home = "0.5.12"
indoc = "2.0.7"
ringbuffer = "0.16.0"
fs-err = { git = "https://github.com/shellixyz/fs-err", branch = "custom", version = "3.0.0" }
ambassador = "0.5.1"
derive_builder = "0.20.2"
tempfile = "3.27.0"
libc = "0.2.189"
cros-libva = { git = "https://github.com/shellixyz/cros-libva", branch = "fix/vp9-libva-2.22-compat", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[features]
default = ["hwaccel"]
hwaccel = ["dep:cros-libva"]

[profile.release]
panic = 'abort'
codegen-units = 1
opt-level = 3
