[package]
name = "appimage_builder"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Michel Pastor <shellixyz@gmail.com>"]
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0.104"
cargo_toml = "1.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
indicatif = "0.18.6"
indoc = "2.0.7"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["stream"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
which = "8.0.6"
